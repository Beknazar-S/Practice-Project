<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo">✦</div>
      <span class="brand-name">TaskFlow</span>
    </div>

    <div class="auth-card">
      <div class="tab-switcher">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
          <span class="field-error" id="loginEmailErr"></span>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
          <span class="field-error" id="loginPasswordErr"></span>
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form hidden" novalidate>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Alex Johnson" required />
          <span class="field-error" id="regNameErr"></span>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
          <span class="field-error" id="regEmailErr"></span>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Min 6 chars, A-Z, a-z, 0-9" required />
          <span class="field-error" id="regPasswordErr"></span>
          <div class="password-hints">
            <span id="hint-length" class="hint">✗ 6+ characters</span>
            <span id="hint-upper" class="hint">✗ Uppercase</span>
            <span id="hint-lower" class="hint">✗ Lowercase</span>
            <span id="hint-num" class="hint">✗ Number</span>
          </div>
        </div>
        <div class="form-error" id="registerError"></div>
        <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('tf_token')) window.location.href = '/pages/dashboard.html';

    function switchTab(tab) {
      document.getElementById('loginTab').classList.toggle('active', tab === 'login');
      document.getElementById('registerTab').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
    }

    // Password strength hints
    document.getElementById('regPassword').addEventListener('input', function () {
      const v = this.value;
      setHint('hint-length', v.length >= 6);
      setHint('hint-upper', /[A-Z]/.test(v));
      setHint('hint-lower', /[a-z]/.test(v));
      setHint('hint-num', /\d/.test(v));
    });

    function setHint(id, ok) {
      const el = document.getElementById(id);
      el.textContent = (ok ? '✓ ' : '✗ ') + el.textContent.slice(2);
      el.classList.toggle('hint-ok', ok);
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      let valid = true;

      if (!validateEmail(email)) {
        showFieldError('loginEmailErr', 'Enter a valid email');
        valid = false;
      }
      if (!password) {
        showFieldError('loginPasswordErr', 'Password is required');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      try {
        const data = await api.login({ email, password });
        localStorage.setItem('tf_token', data.token);
        localStorage.setItem('tf_user', JSON.stringify(data.user));
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        document.getElementById('loginError').textContent = err.message;
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });

    // REGISTER
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      let valid = true;

      if (name.length < 2) { showFieldError('regNameErr', 'Name must be at least 2 characters'); valid = false; }
      if (!validateEmail(email)) { showFieldError('regEmailErr', 'Enter a valid email'); valid = false; }
      if (password.length < 6 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/\d/.test(password)) {
        showFieldError('regPasswordErr', 'Password must be 6+ chars with uppercase, lowercase, and number');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('registerBtn');
      btn.textContent = 'Creating account…';
      btn.disabled = true;

      try {
        const data = await api.register({ name, email, password });
        localStorage.setItem('tf_token', data.token);
        localStorage.setItem('tf_user', JSON.stringify(data.user));
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        document.getElementById('registerError').textContent = err.message;
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    });

    function showFieldError(id, msg) {
      document.getElementById(id).textContent = msg;
    }

    function clearErrors() {
      document.querySelectorAll('.field-error, .form-error').forEach(el => el.textContent = '');
    }
  </script>
</body>
</html>
